replicaCount: 1

image:
  repository: 374894298799.dkr.ecr.ap-south-1.amazonaws.com/kubernetes-flask
  tag: v3
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 5006

postgres:
  image:
    repository: postgres
    tag: "16"

  database: employees
  username: Ayush

  storage:
    size: 1Gi
    storageClass: gp2

database:
  host: postgres-service
  port: 5432
  name: employees
  user: Ayush
