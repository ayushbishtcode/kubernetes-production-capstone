apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ include "flask-postgres.fullname" . }}-postgres

spec:
  serviceName: {{ include "flask-postgres.fullname" . }}-postgres-service
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: "{{ .Values.postgres.database }}"

            - name: POSTGRES_USER
              value: "{{ .Values.postgres.username }}"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flask-postgres.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
                  
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-storage

      spec:
        storageClassName: {{ .Values.postgres.storage.storageClass }}
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
